<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | LifeLink AI Medical Platform</title>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/glassmorphism.css">
  <link rel="stylesheet" href="css/3d-theme.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Video & Motion Background Backdrop -->
  <div class="video-bg-container">
    <video class="video-bg" autoplay muted loop playsinline poster="assets/blood-cells-bg.webp">
      <source src="assets/blood-cells-motion.mp4" type="video/mp4">
    </video>
    <div class="video-bg-overlay"></div>
  </div>

  <!-- 3D Canvas Background -->
  <div id="threejs-bg-container"></div>
  <div class="ambient-glow ambient-glow-1"></div>
  <div class="ambient-glow ambient-glow-2"></div>

  <div class="app-wrapper">
    
    <!-- Navbar -->
    <nav class="navbar">
      <div class="nav-container">
        <a href="index.html" class="nav-brand">
          <div class="brand-icon"><i class="fa-solid fa-droplet"></i></div>
          <span>LifeLink <span class="text-crimson">AI</span></span>
        </a>

        <div class="nav-actions">
          <a href="index.html" class="btn btn-glass btn-sm">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
          </a>
        </div>
      </div>
    </nav>

    <!-- Login Container -->
    <main class="container flex items-center justify-center" style="min-height: calc(100vh - 76px); padding: 5rem 1.5rem;">
      
      <div class="glass-card" style="width: 100%; max-width: 480px; padding: 2.5rem;">
        
        <div class="text-center" style="margin-bottom: 2rem;">
          <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 50px; height: 50px; font-size: 1.5rem;">
            <i class="fa-solid fa-droplet"></i>
          </div>
          <h2>Welcome to LifeLink AI</h2>
          <p style="font-size: 0.92rem; margin-top: 0.3rem;">Sign in to access your Indian emergency response dashboard.</p>
        </div>

        <!-- 1-Click Demo Profiles -->
        <div style="background: var(--bg-surface-elevated); border: 1px solid var(--border-glass); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1.75rem;">
          <div style="font-size: 0.8rem; font-weight: 700; color: var(--accent-cyan); margin-bottom: 0.6rem; text-transform: uppercase;">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Instant 1-Click Demo Login:
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button class="btn btn-sm btn-glass" data-switch-role="donor">
              <i class="fa-solid fa-heart text-crimson"></i> Donor (Rohan)
            </button>
            <button class="btn btn-sm btn-glass" data-switch-role="hospital">
              <i class="fa-solid fa-hospital text-cyan"></i> Hospital (Dr. Sharma)
            </button>
            <button class="btn btn-sm btn-glass" data-switch-role="recipient">
              <i class="fa-solid fa-bed-pulse text-amber"></i> Recipient (Meera)
            </button>
            <button class="btn btn-sm btn-glass" data-switch-role="admin">
              <i class="fa-solid fa-shield text-emerald"></i> Admin (Col. Iyer)
            </button>
          </div>
        </div>

        <!-- Standard Login Form -->
        <form id="form-login">
          <div class="form-group">
            <label class="form-label">Email Address:</label>
            <input type="email" id="login-email" class="form-control" placeholder="name@lifelink.ai" value="donor@lifelink.ai" required>
          </div>

          <div class="form-group">
            <label class="form-label">Password:</label>
            <input type="password" id="login-password" class="form-control" value="••••••••" required>
          </div>

          <div class="flex justify-between items-center" style="font-size: 0.85rem; margin-bottom: 1.5rem;">
            <label class="flex items-center gap-2" style="cursor: pointer;">
              <input type="checkbox" checked style="accent-color: var(--primary-500);">
              <span>Remember me</span>
            </label>
            <a href="#" class="text-crimson" onclick="LifeLinkAuth.showToast('Password reset link sent to registered email.', 'info')">Forgot Password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Dashboard
          </button>
        </form>

        <div class="text-center" style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
          Don't have an account yet? 
          <a href="register.html" class="text-crimson" style="font-weight: 700;">Create Donor Account</a>
        </div>

      </div>

    </main>

  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/3d-blood-vase.js"></script>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sos.js"></script>

  <script>
    document.getElementById('form-login').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const res = LifeLinkAuth.login(email, 'pass');
      LifeLinkAuth.showToast(`Signed in as ${res.user.name} (${res.user.role.toUpperCase()})`, 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 500);
    });
  </script>

</body>
</html>
